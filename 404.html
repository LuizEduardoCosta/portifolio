<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1d78c8" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada | Luiz Eduardo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CradialGradient id='g' cx='34%25' cy='26%25' r='78%25'%3E%3Cstop offset='0' stop-color='%23b8f2ff'/%3E%3Cstop offset='.18' stop-color='%2337b9ff'/%3E%3Cstop offset='.55' stop-color='%231675c4'/%3E%3Cstop offset='1' stop-color='%23071d34'/%3E%3C/radialGradient%3E%3Ccircle cx='32' cy='32' r='31' fill='url(%23g)' stroke='%23fff' stroke-width='2'/%3E%3Ctext x='32' y='43' font-family='Segoe UI,Arial,sans-serif' font-size='28' font-weight='700' fill='%23fff' text-anchor='middle'%3ELE%3C/text%3E%3C/svg%3E" />
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      display:grid;place-items:center;padding:24px;
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;
      background:radial-gradient(circle at 50% 32%,#1165a8 0,#062c54 44%,#020e1d 100%);
    }
    .panel{
      width:min(520px,100%);text-align:center;padding:34px 30px 30px;border-radius:11px;
      border:1px solid rgba(255,255,255,.34);background:rgba(21,53,78,.55);
      backdrop-filter:blur(18px) saturate(150%);
      box-shadow:0 24px 70px rgba(0,24,48,.5),inset 0 1px rgba(255,255,255,.22);
    }
    .mark{
      width:70px;height:70px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
      font-size:26px;font-weight:800;letter-spacing:-2px;
      background:radial-gradient(circle at 34% 25%,#b8f2ff 0 6%,#37b9ff 12%,#1675c4 46%,#0a3c70 71%,#071d34 100%);
      border:1px solid rgba(255,255,255,.85);box-shadow:0 0 32px rgba(75,194,255,.5),inset 0 1px 2px #fff;
    }
    .code{font-size:12px;letter-spacing:.22em;font-weight:700;opacity:.7}
    h1{font-size:26px;font-weight:300;letter-spacing:-.03em;margin:10px 0 8px}
    p{margin:0 auto;max-width:38ch;font-size:13px;line-height:1.6;opacity:.76}
    a.home{
      display:inline-block;margin-top:24px;text-decoration:none;font-size:13px;color:#0f3f5d;
      border:1px solid #8fc4e2;border-radius:5px;padding:9px 18px;
      background:linear-gradient(#fff,#cfe7f5);box-shadow:inset 0 1px #fff;
    }
    a.home:hover{background:linear-gradient(#fff,#b0dcf6);border-color:#4fa3d3}
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark">LE</div>
    <div class="code">ERRO 404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe neste portfólio. Volte à área de trabalho para navegar pelas janelas.</p>
    <a class="home" href="/portifolio/">Voltar ao portfólio</a>
  </main>
</body>
</html>
