  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

  <link rel="preload" as="image" href="assets/img/profile.jpg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <noscript>
    <div class="noscript">Este portfólio usa JavaScript para simular a interface de desktop. Ative o JavaScript para visualizar a experiência completa.</div>
  </noscript>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-mark">LE</div>
    <div class="boot-title">Luiz Eduardo OS</div>
    <div class="boot-subtitle">Professional Portfolio · Build 2026.09</div>
    <div class="boot-progress"><span></span></div>
  </div>

  <main id="desktop" class="desktop" aria-label="Área de trabalho do portfólio">
    <div class="wallpaper-glow glow-a"></div>
    <div class="wallpaper-glow glow-b"></div>
    <div class="wallpaper-lines" aria-hidden="true"></div>

    <header class="desktop-brand" aria-label="Identidade do portfólio">
      <div class="brand-kicker">LUIZ EDUARDO OS</div>
      <h1>Dados, tecnologia e soluções que conectam informação a decisões.</h1>
      <p>Portfólio profissional · Brasília, DF</p>
    </header>

    <section class="desktop-icons" aria-label="Atalhos">
      <button class="desktop-icon" data-open="about" type="button">
        <span class="icon-art icon-blue">👤</span><span>Sobre mim</span>
      </button>
      <button class="desktop-icon" data-open="projects" type="button">
        <span class="icon-art icon-gold">📁</span><span>Projetos</span>
      </button>
      <button class="desktop-icon" data-open="experience" type="button">
        <span class="icon-art icon-teal">💼</span><span>Experiência</span>
      </button>
      <button class="desktop-icon" data-open="education" type="button">
        <span class="icon-art icon-violet">🎓</span><span>Formação</span>
      </button>
      <button class="desktop-icon" data-open="certifications" type="button">
        <span class="icon-art icon-cyan">🏅</span><span>Cursos</span>
      </button>
      <button class="desktop-icon" data-open="skills" type="button">
        <span class="icon-art icon-green">📊</span><span>Competências</span>
      </button>
      <button class="desktop-icon" data-open="creative" type="button">
        <span class="icon-art icon-gold"><img src="assets/img/creative-production-icon.png" alt="" aria-hidden="true"></span><span>Produção criativa</span>
      </button>
      <button class="desktop-icon" data-open="media" type="button">
        <span class="icon-art icon-pink">🎵</span><span>Media Player</span>
      </button>
      <button class="desktop-icon" data-open="lattes" type="button">
        <span class="icon-art icon-sky">📄</span><span>Currículo Lattes</span>
      </button>
      <button class="desktop-icon" data-open="linkedin" type="button">
        <span class="icon-art icon-linkedin">in</span><span>LinkedIn</span>
      </button>
    </section>

    <section id="window-layer" class="window-layer" aria-live="polite"></section>

    <div id="start-menu" class="start-menu" aria-hidden="true">
      <div class="start-left">
        <div class="start-search-wrap">
          <input id="start-search" type="search" placeholder="Pesquisar no portfólio" aria-label="Pesquisar no portfólio" />
        </div>
        <div id="start-results" class="start-results"></div>
      </div>
      <div class="start-right">
        <div class="start-profile">
          <img src="assets/img/profile.jpg" alt="Luiz Eduardo de Carvalho Costa" />
          <div><strong>Luiz Eduardo</strong><span>Portfólio profissional</span></div>
        </div>
        <button type="button" data-open="about">Sobre mim</button>
        <button type="button" data-open="projects">Projetos</button>
        <button type="button" data-open="experience">Experiência</button>
        <button type="button" data-open="education">Formação</button>
        <button type="button" data-open="skills">Competências</button>
        <button type="button" data-open="creative">Produção criativa</button>
        <button type="button" data-open="media">Media Player</button>
        <button type="button" data-open="lattes">Currículo Lattes</button>
        <button type="button" data-open="linkedin">LinkedIn</button>
        <div class="start-links">
          <button type="button" data-open="lattes">Lattes</button>
          <button type="button" data-open="linkedin">LinkedIn</button>
        </div>
      </div>
    </div>

    <nav class="taskbar" aria-label="Barra de tarefas">
      <button id="start-button" class="start-button" type="button" aria-expanded="false" aria-controls="start-menu" title="Iniciar">
        <span>LE</span>
      </button>
      <div class="taskbar-pinned" aria-label="Atalhos fixados">
        <button type="button" data-open="about" title="Sobre mim">👤</button>
        <button type="button" data-open="projects" title="Projetos">📁</button>
        <button type="button" data-open="skills" title="Competências">📊</button>
        <button type="button" data-open="media" title="Media Player">🎵</button>
      </div>
      <div id="taskbar-windows" class="taskbar-windows" aria-label="Janelas abertas"></div>
      <div class="system-tray">
        <span class="tray-icons" aria-hidden="true">◉ ▰ ♫</span>
        <button id="clock" class="clock" type="button" title="Data e hora"></button>
      </div>
    </nav>
  </main>

  <template id="window-template">
    <article class="aero-window" role="dialog" aria-modal="false">
      <header class="window-titlebar">
        <div class="window-title"><span class="window-icon"></span><span class="window-name"></span></div>
        <div class="window-controls">
          <button type="button" class="win-min" aria-label="Minimizar">—</button>
          <button type="button" class="win-max" aria-label="Maximizar">□</button>
          <button type="button" class="win-close" aria-label="Fechar">×</button>
        </div>
      </header>
      <div class="window-body"></div>
      <div class="window-status"><span>Luiz Eduardo OS</span><span>Professional Portfolio</span></div>
    </article>
  </template>

  <script src="assets/js/portfolio-data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
